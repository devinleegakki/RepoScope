name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    name: Validate and publish source archive
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r config/requirements-dev.txt

      - name: Check code quality
        run: python -m ruff check .

      - name: Compile Python sources
        run: python -m compileall -q .

      - name: Run tests
        run: >-
          python -m pytest -q
          --cov=core --cov=cli --cov=gui --cov=reposcope --cov=main.py
          --cov-report=term-missing --cov-fail-under=60

      - name: Create source archive
        shell: bash
        run: |
          archive="RepoScope-${GITHUB_REF_NAME}.zip"
          git archive --format=zip --prefix="RepoScope-${GITHUB_REF_NAME}/" "${GITHUB_REF_NAME}" -o "${archive}"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: RepoScope-${{ github.ref_name }}.zip
