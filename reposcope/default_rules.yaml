# RepoScope default analysis configuration
# Owner: TYB (task 2 - metrics & anti-pattern rules)
# Values match the project proposal section 2.4 / 3.2.

# Observation windows (days)
observation_days: 90
recent_days: 90
trend_bucket: day            # day | week | month

# Detection thresholds
stale_days: 180
large_file_mb: 10.0
single_maintainer_ratio: 0.70
release_stale_days: 365
hotspot_changes: 10
commit_message_pattern: '^(feat|fix|docs|refactor)(\(.+\))?:'
min_message_length: 5

# File extensions treated as binary / large-file risk
binary_extensions:
  - .png
  - .jpg
  - .jpeg
  - .gif
  - .bmp
  - .ico
  - .pdf
  - .zip
  - .tar
  - .gz
  - .7z
  - .exe
  - .dll
  - .so
  - .bin
  - .pyc
  - .class
  - .jar
  - .mp3
  - .mp4
  - .woff
  - .woff2
  - .ttf

# Risk level per anti-pattern rule: high (red) | medium (orange) | low (blue)
rule_levels:
  single_maintainer: high
  secret: high
  dangerous_code: high
  release_stale_illusion: medium
  hotspot_changes: medium
  large_file: medium
  dependency: medium
  test_coverage: medium
  ownership: medium
  code_quality: low
  stale_file: low
  commit_message: low
